name: Build desktop apps

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Seek-Windows-x64
          - os: macos-latest
            artifact: Seek-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm packaging/seek.spec

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 模拟用户从网上下载 zip 后解压：给所有文件加上“来自 Internet”标记
          Get-ChildItem dist\Seek -Recurse -File | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          # 窗口程序不会阻塞终端，需要等待进程结束再检查退出码
          function Invoke-SelfTest($name) {
            $env:SEEK_DATA_DIR = "$env:RUNNER_TEMP\$name"
            $p = Start-Process -FilePath "dist\Seek\Seek.exe" -ArgumentList "--self-test" -Wait -PassThru
            Get-Content "$env:SEEK_DATA_DIR\seek.log" -Tail 8
            return $p.ExitCode
          }
          # 确认去掉 .config 时能复现加载失败，说明测试有效
          Rename-Item dist\Seek\Seek.exe.config Seek.exe.config.off
          $without = Invoke-SelfTest "selftest-noconfig"
          Rename-Item dist\Seek\Seek.exe.config.off Seek.exe.config
          Write-Host "exit code without config: $without"
          $with = Invoke-SelfTest "selftest"
          if ($with -ne 0) { throw "self-test failed: $with" }
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\selftest*"
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: SEEK_DATA_DIR="$RUNNER_TEMP/seek-selftest" dist/Seek.app/Contents/MacOS/Seek --self-test

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Seek -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Seek.app "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
